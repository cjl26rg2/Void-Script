<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root{
    --bg:#0e1016; --card:#171a24; --line:rgba(255,255,255,.10);
    --fg:#eef0f6; --muted:#a6acbd; --dim:#6f7686;
    --acc:#ff5c8a; --acc2:#ff8a3d; --acc-txt:#ffd9c0;
    --ok:#3ddc97; --warn:#f5b942; --rose:#ff8fa3;
  }
  *{box-sizing:border-box}
  body{
    width:270px; margin:0; color:var(--fg);
    font-family:"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    background:radial-gradient(130% 80% at 50% -10%, #2a1a24 0%, var(--bg) 55%);
  }
  .pad{padding:15px}
  header{display:flex; align-items:center; gap:10px; margin-bottom:13px}
  header .mark{width:26px; height:26px; flex:0 0 auto;
    filter:drop-shadow(0 0 6px rgba(255,138,61,.55))}
  .title{font-weight:750; font-size:16px; letter-spacing:-.2px; flex:1}
  .title .s{background:linear-gradient(90deg,var(--acc-txt),var(--acc2) 55%,var(--acc));
    -webkit-background-clip:text; background-clip:text; color:transparent}
  #version{font-size:10px; color:var(--dim); font-weight:600}
  #provider-tag{font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    color:var(--acc-txt); background:rgba(255,138,61,.16); padding:3px 7px; border-radius:999px}

  .status{display:flex; align-items:center; gap:9px; background:var(--card);
    border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:11px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 1px rgba(255,138,61,.05)}
  #status-dot{width:10px; height:10px; border-radius:50%; background:#5b5b6b; flex:0 0 auto;
    transition:background .25s, box-shadow .25s}
  #status-dot.up{background:var(--ok); box-shadow:0 0 9px var(--ok); animation:vs-popdot 2.2s ease-out infinite}
  #status-dot.mid{background:var(--warn); box-shadow:0 0 9px var(--warn)}
  @keyframes vs-popdot{0%,100%{box-shadow:0 0 6px rgba(61,220,151,.55)}50%{box-shadow:0 0 12px rgba(61,220,151,.9)}}
  .status .lines{min-width:0}
  #status-text{font-size:12.5px; font-weight:600; line-height:1.35}
  #tool-count{font-size:11px; color:var(--muted)}
  #server-list{font-size:11px; color:var(--dim); white-space:pre-line;
    font-family:ui-monospace,monospace; margin-top:6px}
  #server-list:empty{display:none}

  #update-row{display:flex; align-items:center; gap:9px; background:rgba(251,191,36,.12);
    border:1px solid rgba(251,191,36,.38); border-radius:13px; padding:10px 12px; margin-bottom:11px}
  #update-row[hidden]{display:none}
  #update-text{font-size:12px; font-weight:650; color:var(--warn); flex:1; line-height:1.3}
  #update-tag{font-weight:700; color:var(--warn)}
  #btn-update{flex:0 0 auto; width:auto; margin-top:0; padding:7px 12px; color:var(--fg);
    border-color:rgba(251,191,36,.5); background:rgba(251,191,36,.16)}
  #btn-update:hover{background:rgba(251,191,36,.26)}

  button{width:100%; margin-top:7px; padding:9px 12px; border-radius:10px; cursor:pointer;
    font-size:12px; font-weight:600; color:var(--fg); border:1px solid var(--line);
    background:rgba(255,255,255,.05); text-align:left;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    transition:background .15s, transform .12s, border-color .15s, box-shadow .15s; display:flex; align-items:center; gap:9px}
  button:hover{background:rgba(255,255,255,.10); transform:translateY(-1px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 4px 12px rgba(0,0,0,.28)}
  button:active{transform:translateY(1px); box-shadow:none}
  button:focus-visible{outline:2px solid rgba(255,138,61,.85); outline-offset:2px}
  button .g{opacity:.85}

  .hint{margin-top:13px; font-size:11px; line-height:1.5; color:var(--dim)}
  .hint code{background:rgba(255,255,255,.08); padding:1px 5px; border-radius:4px;
    font-family:ui-monospace,monospace}

  .tl{margin-top:13px; background:var(--card); border:1px solid var(--line);
    border-radius:13px; padding:10px 12px}
  .tl-head{font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    color:var(--muted); margin-bottom:7px; display:flex; align-items:center; gap:6px}

  #lb{font-size:10.5px; font-family:ui-monospace,monospace}
  .lb-row{display:flex; align-items:center; gap:8px; padding:3px 0; border-top:1px solid var(--line); margin-top:3px}
  .lb-rank{color:var(--acc2); font-weight:700; width:14px; flex:0 0 auto}
  .lb-name{flex:1; font-weight:600; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lb-meta{color:var(--dim); text-align:right}
  .lb-rate{color:var(--ok); font-weight:700}
  .lb-bar{position:relative; height:4px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden; width:100%; margin-top:2px}
  .lb-fill{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,var(--ok),var(--acc2)); height:100%}
  #tl-list{font-size:10.5px; line-height:1.55; font-family:ui-monospace,monospace; color:var(--muted)}
  #tl-list .tl-item{display:flex; gap:6px; align-items:baseline}
  #tl-list .tl-t{color:var(--dim); flex:0 0 auto}
  #tl-list .tl-ok{color:var(--ok)}
  #tl-list .tl-err{color:var(--rose)}
  #tl-list .tl-evt{color:var(--warn)}
  #tl-list .tl-conv{color:var(--dim); font-size:9px}
  #tl-list:empty::after{content:"No commands recorded this session."; color:var(--dim)}
</style>
</head>
<body>
<div class="pad">
  <header>
    <svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd9c0"/><stop offset=".5" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff5c8a"/>
        </linearGradient>
        <radialGradient id="v" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#0b0d13"/><stop offset=".7" stop-color="#131420"/><stop offset="1" stop-color="#241a28"/>
        </radialGradient>
      </defs>
      <circle cx="64" cy="64" r="54" fill="url(#v)"/>
      <circle cx="64" cy="64" r="54" fill="none" stroke="url(#r)" stroke-width="9"/>
      <g stroke="url(#r)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="49,44 30,64 49,84"/><polyline points="79,44 98,64 79,84"/><line x1="71" y1="40" x2="57" y2="88"/>
      </g>
    </svg>
    <span class="title">Void<span class="s">Script</span> <span id="version"></span></span>
    <span id="provider-tag">Ready</span>
  </header>

  <div id="update-row" hidden>
    <div id="update-text">Update available<span id="update-tag"></span> — get the new build</div>
    <button id="btn-update">Get it</button>
  </div>

  <div class="status">
    <span id="status-dot"></span>
    <div class="lines">
      <div id="status-text">Checking bridge…</div>
      <div id="tool-count"></div>
      <div id="server-list"></div>
    </div>
  </div>

  <button id="btn-reconnect"><span class="g">↻</span> Reconnect bridge</button>
  <button id="btn-restart"><span class="g">⟳</span> Restart Roblox server</button>
  <button id="btn-settings"><span class="g">⚙</span> Settings &amp; switch AI</button>
  <button id="btn-site"><span class="g">🌐</span> Open the VoidScript website</button>

  <div class="tl">
    <div class="tl-head">Provider leaderboard</div>
    <div id="lb"><span style="color:var(--dim);font-size:10.5px">No builds recorded yet.</span></div>
  </div>

  <div class="tl">
    <div class="tl-head">Session timeline</div>
    <div id="tl-list"></div>
  </div>

  <p class="hint">Run <code>start.bat</code>, open <b>Roblox Studio</b>, then head to a supported AI and press <b>Start session</b>.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
