<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VoidScript Development">
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9c0"/>
      <stop offset=".5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="h" gradientUnits="userSpaceOnUse" x1="-20" y1="-22" x2="20" y2="30">
      <stop offset="0" stop-color="#ffe6d4"/>
      <stop offset=".45" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <radialGradient id="v" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset=".7" stop-color="#131420"/>
      <stop offset="1" stop-color="#241a28"/>
    </radialGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the claw hammer, handle pointing down from the head's centre -->
    <g id="hammer">
      <rect x="-3.5" y="-8" width="7" height="36" rx="3.5"/>
      <rect x="-15" y="-20" width="25" height="12" rx="2.5"/>
      <rect x="-20" y="-23" width="8" height="18" rx="2.5"/>
      <path d="M8 -20 C17 -20 22 -15 23 -6 L18.5 -6 C17 -11 13 -12.5 8 -11.5 Z"/>
    </g>
  </defs>

  <!-- the VoidScript logo -->
  <circle cx="64" cy="64" r="54" fill="url(#v)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#r)" stroke-width="9" filter="url(#g)"/>
  <g stroke="url(#r)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#g)">
    <polyline points="49,44 30,64 49,84"/>
    <polyline points="79,44 98,64 79,84"/>
    <line x1="71" y1="40" x2="57" y2="88"/>
  </g>

  <!-- the hammer, striking toward the code -->
  <g transform="translate(99 96) rotate(-38)">
    <use href="#hammer" fill="#0b0d13" stroke="#0b0d13" stroke-width="9" stroke-linejoin="round"/>
    <use href="#hammer" fill="url(#h)" filter="url(#g)"/>
    <!-- shine on the face and a dark seam where the head meets the handle -->
    <rect x="-18.5" y="-21" width="2.5" height="14" rx="1.2" fill="#ffffff" opacity=".7"/>
    <rect x="-3.5" y="-8.5" width="7" height="2" fill="#0b0d13" opacity=".45"/>
    <!-- strike sparks off the face -->
    <g stroke="#ffd9c0" stroke-width="3.2" stroke-linecap="round" filter="url(#g)">
      <line x1="-26" y1="-24" x2="-32" y2="-28"/>
      <line x1="-27" y1="-14" x2="-34" y2="-13"/>
      <line x1="-22" y1="-31" x2="-25" y2="-37"/>
    </g>
  </g>
</svg>
